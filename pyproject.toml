[project]
name = "localhost-times"
version = "1.0.0"
description = "A private morning newspaper and audio briefing from your inbox, calendar and news, written on your machine by an open model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "icalendar>=7.3.0",
    "python-dotenv>=1.2.4",
    "recurring-ical-events>=3.8.2",
]

[project.scripts]
localhost-times = "localhost_times.cli:main"

[project.urls]
Homepage = "https://github.com/mohamedaminehamdi/the-localhost-times"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["localhost_times"]

[dependency-groups]
dev = ["pytest>=8"]
